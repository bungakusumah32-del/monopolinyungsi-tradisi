<style>

<script>

["Salah sahiji ciri téks pedaran tradisi nyaéta…","Ngagunakeun basa baku jeung eusina objéktif","Pinuh ku kecap sora tiruan","Ngan ukur humor","Teu aya data","Pedaran nyoko kana fakta jeung basa baku."],

["Nilai syukur dina Seren Taun diébréhkeun ku…","Nganuhunkeun ka Nu Maha Kawasa kana hasil tatanén","Nyalahkeun cuaca","Ngajual sakabéh paré","Ngalaan sawah","Syukur = pamuji kana nikmat."],

["Bédana téks pedaran jeung narasi nyaéta…","Pedaran ngajéntrékeun hal, narasi ngalalakonkeun kajadian","Duanana sarua","Pedaran ngan ukur carita","Narasi tanpa tokoh","Pedaran = déskripsi, narasi = lalakon."],

["Lamun tradisi Seren Taun mimiti jarang dipiluan ku barudak ngora, léngkah naon anu paling merenah pikeun ngajaga kalumangsunganana?","Ngalibatkeun jajaka-ngora jadi panitia jeung ngadamel kagiatan kreatif sarta medsos","Ngalarang barudak ngora balanja","Ngaleungitkeun Seren Taun","Ngantosan baé tanpa tarékah","Ngalibatkeun generasi ngora ngajaga tradisi tetep hirup."],

["Téks pedaran tradisi boga tésis kuat tapi teu aya argumén. Kumaha ngalengkepanana?","Nambahan data, conto, kasaksian narasumber, jeung alesan logis","Mupus tésisna","Nambahan hiasan baé","Ngulang tésis lima kali","Argumén kudu ngarojong tésis ku bukti."],
["Sisingaan beuki réa dipidangkeun pikeun wisatawan. Résiko anu kudu diwaspadaan?","Tradisi leungit makna aslina lamun ngan jadi dagangan","Pamaén jadi pinter","Seni jadi leuwih kawéntar","Cai jadi beresih","Kudu ngimbangan pariwisata jeung ngajaga nilai tradisi."],
["Lamun Ngalaksa digawé tanpa gotong royong, naon pangaruh pangbadagna?","Kaeratan warga mudun jeung tradisi hésé lumangsung","Laksa jadi leuwih amis","Warga leuwih gancang bobo","Paré langsung loba","Gotong royong téh tihang pangbadag lumangsungna upacara."]];

/* Ikon SVG nyocogkeun gambar rujukan */
const SV={

s:['stars','TITIK AWAL','#8fdc6a','#3b2412','s'],
qy:['cq','Candak Kartu Patarosan','#fff07a','#3b2412','q'],
qp:['cq','Candak Kartu Patarosan','#f6a6b8','#3b2412','qr'],

function gridPos(i){ // ngitung baris/kolom grid pikeun indéks jalur
  if(i===0)return[6,9]; if(i<=4)return[6-i,9]; if(i===5)return[1,9]; if(i<=12)return[1,9-(i-5)]; if(i===13)return[1,1]; if(i<=18)return[2+(i-14),1]; if(i===19)return[7,1]; if(i<=26)return[7,2+(i-20)]; return[7,9];}

/* ===== SUARA ===== */
let ac;function beep(f=440,d=.1,t='sine'){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}

/* ===== MENU ===== */
function names(){const n=+$('np').value;$('names').innerHTML=[...Array(n)].map((_,i)=>`<label>${ICO[i]} Ngaran kelompok ${i+1}<input id="n${i}" placeholder="Kelompok ${i+1}" maxlength="18"></label>`).join('')}
function help(){modal(`<h2>📖 Petunjuk Bermain</h2><ol><li>Kelompok giliran néken <b>KOCOK DADU</b>; pion maju nurutkeun angka dadu.</li><li>Petak kartu konéng = kartu Gampil (10 poin). Petak kartu pink = kartu acak (biasana Gampil, sakapeung HOTS 20 poin). Petak beureum pojok katuhu luhur = pasti kartu HOTS. Jawaban salah = 0 poin.</li><li>➡️ maju 2, ⬅️ mundur 2, 🎲 mundur 3, 💣 balik ka titik awal, 🪘 (Balik ka KA/START) ogé balik ka Titik Awal. Pangaruh petak ngan dijalankeun sakali (teu nyambung ka petak séjén).</li><li>Tingkat <i>Gampang</i>: pilihan jawaban dikurangan hiji. <i>Sesah</i>: +5 poin unggal jawaban bener.</li><li>Nepi ka 🏁 <b>Geus Nepi</b> (kaasup lamun dadu leuwih) méré bonus +20 poin, tuluy kaulinan réngsé.</li><li><b>Pamenang</b>: poin pangluhurna. Lamun sarua, anu munggaran nepi ka finis anu meunang.</li></ol><button class="g" onclick="closeM()">SIAP!</button>`)}
function save(){try{if(S&&S.phase!=='end')localStorage.setItem('nsp_state',JSON.stringify(S));}catch(e){}}
function hasSave(){try{return !!localStorage.getItem('nsp_state')}catch(e){return false}}
function newGame(){const n=+$('np').value;S={n,df:+$('df').value,cur:0,phase:'roll',usedQ:[],usedH:[],pl:[...Array(n)].map((_,i)=>({name:($('n'+i).value||'').trim()||'Kelompok '+(i+1),pos:0,pts:0,ok:0,no:0,ans:0,fin:false}))};enter()}
function resume(){try{S=JSON.parse(localStorage.getItem('nsp_state'));if(!S)throw 0;S.phase='roll';enter()}catch(e){toast('Teu aya kaulinan nu disimpen')}}
function enter(){$('menu').style.display='none';$('game').style.display='block';buildBoard();ui();save()}
function toMenu(){closeM();$('game').style.display='none';$('menu').style.display='block';$('bResume').style.display=hasSave()?'block':'none'}

/* ===== PAPAN ===== */
function buildBoard(){let h=`<div id="ctr"><div class="e">🪘🎶🌾🎭</div><h2>NYUNGSI PANGARTI:<br>TRADISI SUNDA</h2><div class="rb">Kaulinan Papan Balad</div><div class="e">📚🏠👘🗡️</div></div>`;
  T.forEach((t,i)=>{const[r,c]=gridPos(i),m=M[t];h+=`<div class="cell" id="c${i}" style="grid-area:${r}/${c};background:${m[2]};color:${m[3]}" title="${m[1]}"><em>${i+1}</em>${SV[m[0]]||''}<small class="${m[0]?'':'big'}"${m[0]?'':' style="font-size:clamp(8px,1.8vw,19px)"'}>${m[1]}</small><div class="tk"></div></div>`});
  $('board').innerHTML=h;tokens()}
function tokens(){document.querySelectorAll('.tk').forEach(e=>e.innerHTML='');S.pl.forEach((p,i)=>{$('c'+p.pos).querySelector('.tk').insertAdjacentHTML('beforeend',`<span class="pw" style="background:${COL[i]}">${ICO[i]}</span>`)})}
function ui(){const p=S.pl[S.cur];$('turn').innerHTML=`Giliran: <span style="color:${COL[S.cur]}">${ICO[S.cur]} ${p.name}</span>`;$('bRoll').disabled=S.phase!=='roll';$('bEnd').disabled=S.phase!=='roll';
  $('mini').innerHTML='<b>Skor</b>'+S.pl.map((q,i)=>`<div class="chip ${i===S.cur?'on':''}"><span class="dot" style="background:${COL[i]}">${ICO[i]}</span><b>${q.name}</b>&nbsp;· petak ${q.pos+1} · ${q.pts} poin</div>`).join('');tokens()}
function scoreTable(){modal(`<h2>📊 Skor</h2><table><tr><th>Kelompok</th><th>Petak</th><th>Poin</th><th>✔</th><th>✘</th><th>Kartu</th></tr>${S.pl.map((q,i)=>`<tr><td>${ICO[i]} ${q.name}</td><td>${q.pos+1}</td><td><b>${q.pts}</b></td><td>${q.ok}</td><td>${q.no}</td><td>${q.ans}</td></tr>`).join('')}</table><br><button class="g" onclick="closeM()">TUTUP</button>`)}

/* ===== GERAK PION: sapetak-sapetak ===== */
async function step(p,d){p.pos+=d;tokens();beep(380+p.pos*12,.07,'square');await sleep(280)}
async function move(p,n){const d=Math.sign(n);for(let k=0;k<Math.abs(n);k++){if(d>0&&p.pos>=LAST)break;if(d<0&&p.pos<=0)break;await step(p,d)}}
async function roll(){ // KOCOK DADU: dikonci ku phase supaya teu bisa dua kali
  if(S.phase!=='roll')return;S.phase='busy';ui();const p=S.pl[S.cur];
  try{const dc=$('dice');dc.classList.add('roll');for(let i=0;i<7;i++){dc.textContent='⚀⚁⚂⚃⚄⚅'[Math.floor(Math.random()*6)];beep(300+i*40,.05);await sleep(90)}
    const v=1+Math.floor(Math.random()*6);dc.classList.remove('roll');dc.textContent='⚀⚁⚂⚃⚄⚅'[v-1];toast(`${p.name} meunang dadu ${v}`,1200);await sleep(500);
    await move(p,v);await land(p)}catch(e){console.error(e);S.phase='roll';ui()}}
async function land(p){ // ngajalankeun pangaruh petak (sakali, teu nyambung)
  if(p.pos>=LAST)return finish(p);let t=M[T[p.pos]][4];if(t==='qr')t=Math.random()<.35?'h':'q';
  if(t==='q'||t==='h'){toast(t==='h'?'🧠 Kartu HOTS!':'🃏 Candak kartu patarosan!');await sleep(700);return card(p,t)}
  const fx={f2:['➡️ Maju 2 langkah!',2],b2:['⬅️ Mundur 2 langkah!',-2],b3:['🎲 Mundur 3 langkah!',-3]}[t];
  if(fx){toast(fx[0]);beep(520,.2);await sleep(700);await move(p,fx[1]);if(p.pos>=LAST)return finish(p)}
  else if(t==='bom'){toast('💣 Kembali ka mulai!');beep(120,.4,'sawtooth');await sleep(700);p.pos=0;tokens();await sleep(400)}
  else if(t==='bal'){toast('🪘 Balik ka Titik Awal!');await sleep(700);p.pos=0;tokens();await sleep(400)}
  next()}
function next(){S.cur=(S.cur+1)%S.n;S.phase='roll';save();ui()}

/* ===== KARTU ===== */
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick(t){const src=t==='h'?H:Q,u=t==='h'?S.usedH:S.usedQ;let av=src.map((_,i)=>i).filter(i=>!u.includes(i));if(!av.length){u.length=0;av=src.map((_,i)=>i)}const i=av[Math.floor(Math.random()*av.length)];u.push(i);return src[i]}
function card(p,t){S.phase='card';ui();const c=pick(t),isH=t==='h';
  modal(`<div class="back">${isH?'🧠':'🃏'}</div><h2 style="text-align:center">${isH?'KARTU HOTS (20 poin)':'KARTU PATAROSAN (10 poin)'}</h2><button class="r" style="width:100%" id="bOpen">🎴 BUKA KARTU</button>`);beep(500,.15);
  $('bOpen').onclick=()=>{beep(700,.15);let o=sh([{t:c[1],ok:1},{t:c[2]},{t:c[3]},{t:c[4]}]);if(S.df===1){const w=o.findIndex(x=>!x.ok);o.splice(w,1)}
    modal(`<b style="color:${COL[S.cur]}">${p.name}</b> · ${isH?'HOTS · 20':'Biasa · 10'} poin<h3>${c[0]}</h3><div id="opts">${o.map((x,i)=>`<button class="opt" data-i="${i}">${'ABCD'[i]}. ${x.t}</button>`).join('')}</div><div id="fb"></div>`);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,o,c,p,isH))}}
function answer(b,o,c,p,isH){const bs=document.querySelectorAll('.opt');if(bs[0].disabled)return; // cegah skor ganda
  bs.forEach(x=>x.disabled=true);const ok=!!o[+b.dataset.i].ok;p.ans++;let pts=0;
  bs.forEach((x,i)=>{if(o[i].ok)x.classList.add('ok')});
  if(ok){pts=(isH?20:10)+(S.df===3?5:0);p.pts+=pts;p.ok++;beep(880,.2);beep(1100,.3)}else{p.no++;b.classList.add('no');beep(160,.35,'sawtooth')}
  $('fb').innerHTML=`<p><b>${ok?'✅ Bener! +'+pts+' poin':'❌ Acan bener. +0 poin'}</b><br>${c[5]}</p><button class="g" id="bNext">LANJUTKEUN ▶</button>`;
  $('bNext').onclick=()=>{closeM();next()};ui()}

/* ===== TAMAT ===== */
function finish(p){if(p.fin)return;p.fin=true;p.pts+=20;toast('🏁 Geus nepi! Bonus +20 poin!');beep(1000,.4);setTimeout(()=>end(p),900)}
function end(fin){S.phase='end';try{localStorage.removeItem('nsp_state')}catch(e){}ui();
  const w=[...S.pl].sort((a,b)=>b.pts-a.pts||(b.fin-a.fin))[0],i=S.pl.indexOf(w);
  for(let k=0;k<30;k++){const e=document.createElement('div');e.className='cf';e.textContent=['🎉','🌾','🪘','🎶','✨','🏮'][k%6];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*2+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),7000)}
  [523,659,784,1046].forEach((f,k)=>setTimeout(()=>beep(f,.25),k*180));
  modal(`<div style="text-align:center"><div style="font-size:48px">🏆🌾🪘</div><h2>Wilujeng! Anjeun parantos nyungsi pangarti tina tradisi Sunda!</h2><h3 style="color:${COL[i]}">${ICO[i]} Pamenang: ${w.name}</h3><p>Skor ${w.pts} · Bener ${w.ok} · Kartu dijawab ${w.ans}</p></div><table><tr><th>Kelompok</th><th>Poin</th><th>✔</th><th>Kartu</th></tr>${S.pl.map(q=>`<tr><td>${q.name}${q.fin?' 🏁':''}</td><td>${q.pts}</td><td>${q.ok}</td><td>${q.ans}</td></tr>`).join('')}</table><div class="row" style="margin-top:10px"><button class="g" onclick="newSame()">🔁 ULANGI PERMAINAN</button><button class="b" onclick="toMenu()">🏠 KEMBALI KA MENU</button></div>`)}
function newSame(){closeM();const n=S.n,df=S.df,nm=S.pl.map(p=>p.name);S={n,df,cur:0,phase:'roll',usedQ:[],usedH:[],pl:nm.map(name=>({name,pos:0,pts:0,ok:0,no:0,ans:0,fin:false}))};buildBoard();ui();save()}

/* ===== PASANGAN TOMBOL ===== */
$('np').onchange=names;names();
$('bStart').onclick=()=>{beep(600,.1);newGame()};$('bResume').onclick=resume;$('bHelp').onclick=$('bHelp2').onclick=help;
$('bSnd').onclick=$('bSnd2').onclick=togSnd;$('bRoll').onclick=roll;$('bScore').onclick=scoreTable;
$('bEnd').onclick=()=>{if(S.phase==='roll')end()};$('bMenu').onclick=toMenu;
$('bResume').style.display=hasSave()?'block':'none';setSnd();
</script></body></html>
